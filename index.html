<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lesson 1: Your First WebGL Shader</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0f; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<canvas id="glcanvas"></canvas>

<script>
// ============================================================
// LESSON 1: How WebGL actually works, from zero
// ============================================================
//
// The big idea: your computer's GPU can color THOUSANDS of pixels
// at the exact same time (in parallel). WebGL is just a JS API that
// lets us hand the GPU two small programs, written in a language
// called GLSL, and it runs them super fast:
//
//   1. VERTEX SHADER  -> decides WHERE points/corners go on screen
//   2. FRAGMENT SHADER -> decides the COLOR of each individual pixel
//
// For full-screen art, we barely touch step 1: we just draw one
// rectangle that covers the whole canvas. All the magic happens in
// step 2, where a tiny program runs once for EVERY pixel, and we
// use math (position + time) to pick a color for it.

// --- Step A: grab the canvas and its WebGL "context" (our remote
// control for the GPU) ---
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl');

if (!gl) {
  document.body.innerHTML = 'Your browser does not support WebGL :(';
}

// Make the canvas pixel size match the screen (for sharpness)
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// --- Step B: write our two shader programs as plain strings ---
// GLSL is a C-like language. Don't worry about memorizing syntax yet,
// just read the comments to get the idea.

// VERTEX SHADER: we're just placing 4 corners to cover the screen.
// "a_position" will receive the x,y of each corner we send from JS.
const vertexShaderSource = `
  attribute vec2 a_position;
  void main() {
    // gl_Position needs 4 numbers (x, y, z, w). We only care about x,y.
    gl_Position = vec4(a_position, 0.0, 1.0);
  }
`;

// FRAGMENT SHADER: this runs ONCE PER PIXEL. This is where the art is.
// "u_resolution" = canvas width/height, "u_time" = seconds since start.
// Both are "uniforms" — values we send in from JS that stay constant
// for all pixels during one draw.
const fragmentShaderSource = `
  precision mediump float;
  uniform vec2 u_resolution;
  uniform float u_time;

  void main() {
    // gl_FragCoord.xy is this pixel's screen position (in pixels).
    // Divide by resolution to get a 0.0-1.0 coordinate (uv), so our
    // math works the same regardless of screen size.
    vec2 uv = gl_FragCoord.xy / u_resolution;

    // Make a couple of slowly shifting waves using sin(), offset by uv
    // position so different parts of the screen are out of sync.
    float r = 0.5 + 0.5 * sin(u_time + uv.x * 6.0);
    float g = 0.5 + 0.5 * sin(u_time + uv.y * 6.0 + 2.0);
    float b = 0.5 + 0.5 * sin(u_time + (uv.x + uv.y) * 6.0 + 4.0);

    // gl_FragColor is the final answer: (red, green, blue, alpha)
    gl_FragColor = vec4(r, g, b, 1.0);
  }
`;

// --- Step C: boilerplate to compile a shader from source text ---
function compileShader(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
  }
  return shader;
}

const vertexShader = compileShader(gl.VERTEX_SHADER, vertexShaderSource);
const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource);

// Link both shaders into one "program" the GPU can run
const program = gl.createProgram();
gl.attachShader(program, vertexShader);
gl.attachShader(program, fragmentShader);
gl.linkProgram(program);
gl.useProgram(program);

// --- Step D: define the rectangle (2 triangles) that covers the screen ---
// WebGL's coordinate system goes from -1 to 1 in both x and y,
// with (0,0) at the center. So these 6 points (2 triangles) make
// a rectangle that exactly covers the whole visible area.
const positions = new Float32Array([
  -1, -1,   1, -1,   -1, 1,   // triangle 1
  -1,  1,   1, -1,    1, 1,   // triangle 2
]);

const positionBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

// Tell WebGL how to read that buffer into "a_position" from the vertex shader
const positionLocation = gl.getAttribLocation(program, 'a_position');
gl.enableVertexAttribArray(positionLocation);
gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

// Look up where our uniforms live so we can update them every frame
const resolutionLocation = gl.getUniformLocation(program, 'u_resolution');
const timeLocation = gl.getUniformLocation(program, 'u_time');

// --- Step E: the animation loop ---
// requestAnimationFrame asks the browser "call me right before the
// next screen repaint" — this is how JS animation is done everywhere,
// not just WebGL.
const startTime = performance.now();

function render() {
  const elapsedSeconds = (performance.now() - startTime) / 1000;

  gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
  gl.uniform1f(timeLocation, elapsedSeconds);

  // Draw the rectangle (6 vertices = 2 triangles) using our shaders
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  requestAnimationFrame(render); // loop forever
}

render();
</script>
</body>
</html>
